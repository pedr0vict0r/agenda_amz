<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
  xmlns:layout="https://github.com/ultraq/thymeleaf-layout-dialect">

<head>
<title>Agenda AMZ</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />

<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.0/css/bootstrap.min.css"></link>
<link rel="stylesheet" href="css/style.css" />

<script src="https://use.fontawesome.com/releases/v5.0.13/js/solid.js"></script>
<script src="https://use.fontawesome.com/releases/v5.0.13/js/fontawesome.js"></script>
</head>

<body class="bg-light">

<div class="wrapper">
<nav id="sidebar">
<div class="sidebar-header">
<h3>Agenda AMZ</h3>
</div>

<ul class="list-unstyled components">
<p>Spring Boot</p>
<li>
<a href="/">Home</a>

</li>
<li class="active">
<a href="/contatos">Lista de Contatos</a>
</li>
<li>
<a href="/cadastrarContato">Cadastrar Contato</a>
</li>
</ul>
</nav>

<div id="content">

<nav class="navbar navbar-expand-lg navbar-light bg-light">
<div class="container-fluid">

<button type="button" id="sidebarCollapse" class="btn btn-success">
<i class="fas fa-align-left"></i>
<span></span>
</button>

</div>
<h4>Lista de Contatos</h4>
</nav>

<div class="container-fluid">

<th:block th:replace="msgValidacao :: .alert"></th:block>

<form class="form-inline mb-3" method="get" action="/contatos">
<input class="form-control mr-2" type="text" name="nome" placeholder="Buscar por nome" th:value="${nome}">
<input type="hidden" name="size" th:value="${size}">
<button class="btn btn-outline-success" type="submit">Buscar</button>
</form>

<table class="table table-striped table-hover">
<thead class="thead-dark">
<tr>
<th scope="col">#</th>
<th scope="col">Nome</th>
<th scope="col">Editar / Excluir</th>
</tr>
</thead>
<tbody th:if="${!contatos.content.isEmpty()}" th:each="contato : ${contatos.content}">
<tr>
<th scope="row"><span th:text="${contato.codigo}"></span></th>
<td><a th:href="@{/contatos/{codigo}(codigo=${contato.codigo})}"><span th:text="${contato.nome}"></span></a></td>
<td>
<a th:href="@{/contatos/{codigo}/editar(codigo=${contato.codigo})}"><button type="button" class="btn btn-success"><i class="fas fa-edit"></i></button></a>
<form th:action="@{/contatos/{codigo}/excluir(codigo=${contato.codigo})}" method="post" style="display:inline;">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
<button type="submit" class="btn btn-danger"><i class="fas fa-trash-alt"></i></button>
</form>
</td>
</tr>
</tbody>
</table>

<div th:if="${contatos.content.isEmpty()}" class="alert alert-secondary" role="alert">
Nenhum contato encontrado.
</div>

<nav th:if="${contatos.totalPages > 1}" aria-label="Paginação de contatos">
<ul class="pagination">
<li class="page-item" th:classappend="${contatos.first} ? 'disabled'">
<a class="page-link" th:href="@{/contatos(page=${contatos.number - 1}, size=${size}, nome=${nome})}">Anterior</a>
</li>
<li class="page-item disabled">
<span class="page-link" th:text="${contatos.number + 1} + ' / ' + ${contatos.totalPages}"></span>
</li>
<li class="page-item" th:classappend="${contatos.last} ? 'disabled'">
<a class="page-link" th:href="@{/contatos(page=${contatos.number + 1}, size=${size}, nome=${nome})}">Próxima</a>
</li>
</ul>
</nav>

<div class="line"></div>

</div>
</div>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.0/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.0/js/bootstrap.min.js"></script>

<script type="text/javascript">
$(document).ready(function () {
$('#sidebarCollapse').on('click', function () {
$('#sidebar').toggleClass('active');
});
});
</script>

</body>
</html>
